</style></head><body>
<header><b>🥥 SKP COCO Traders</b><div><button onclick="setLang()">தமிழ் | ENG</button><button onclick="go('d')">🔔<span class="bd" id="bell">0</span></button><span id="syn" style="font-size:12px"></span><button id="inst" style="display:none" onclick="doInst()">📲 Install App</button><button onclick="bk2()">☁️ Sync / Backup</button></div></header>
<div class="app"><nav id="nav"></nav><main id="m"></main></div>
<script>
const $=i=>document.getElementById(i),n=i=>parseFloat($(i).value)||0,M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return String(d.getDate()).padStart(2,'0')+'-'+M[d.getMonth()]+'-'+d.getFullYear()};
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5),R=x=>'₹'+Math.round(x).toLocaleString('en-IN'),uid=()=>Date.now()+Math.random().toString(36).slice(2,5);
const K='skp4';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{f:[],b:[],fe:[],be:[],dh:[],ad:[],hk:[],lb:[],ex:[]};const saveLocal=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

let lang='ta',cur='d',sb={};const t=(a,b)=>lang=='ta'?a:b;

function billP(r,f,cl){return `SKP COCO Traders\nதேதி: ${fd(r.date)}\nவிவசாயி: ${f.name}${f.v?' ('+f.v+')':''}\nவெட்டிய காய்கள்: ${r.g}\nஇலாபக் காய்: ${r.ded}\nபில் காய்கள்: ${r.bill} × ₹${r.rate} = ${R(r.amt)}`+L('வெட்டுக் கூலி',r.cut,1)+`\nபில் நிகரத் தொகை: ${R(r.net)}`+L('வட்டி கழிப்பு',r.int,1)+L('அசல் கழிப்பு',r.pr,1)+`\nஇறுதி பட்டுவாடா: ${R(r.fin)}`+L('முன்பண இருப்பு',-cl)}
function billS(r,b){return `SKP COCO Traders\nதேதி: ${fd(r.date)}\nவியாபாரி: ${b.name}\n\n`+r.rows.map(x=>`${GR.find(g=>g[0]==x.g)[1]}: ${x.pcs} காய்\nகாட்டா எடை: ${x.gk} Kg`+(x.dk>0?`\nகழிவு எடை: ${x.dk} Kg`:'')+`\nநிகர எடை: ${x.nk} Kg\n1 கிலோ விலை: ₹${x.rate}\nதொகை: ${R(x.tot)}`).join('\n\n')+`\nபில் மொத்தம்: ${R(r.total)}\nவாங்கிய தொகை: ${R(r.recv)}`+L('புதிய பாக்கி',b.bal)}
function stk(){let u=0,h=0,k=0;S.fe.forEach(e=>{if(e.k=='P')u+=e.g});S.dh.forEach(e=>{u-=e.p;h+=e.p;k+=e.p});S.ad.forEach(a=>{a.t=='U'?u-=a.p:a.t=='H'?h-=a.p:k-=a.p});S.be.forEach(e=>{if(e.k=='S')e.rows.forEach(x=>{GR.find(g=>g[0]==x.g)[2]=='H'?h-=x.pcs:u-=x.pcs})});S.hk.forEach(e=>k-=e.pcs);return{u,h,k}}
function avgCost(){let a=0,g=0;S.fe.forEach(e=>{if(e.k=='P'){a+=e.amt;g+=e.g}});return g?a/g:0}
function flows(){const o=[];S.fe.forEach(e=>{const f=fm(e.fid);if(e.k=='P'&&e.paid)o.push([e.date,'கொள்முதல் - '+(f&&f.name),-e.paid]);if(e.k=='D'||e.k=='A')o.push([e.date,(e.k=='D'?'பாக்கி பட்டுவாடா - ':'முன்பணம் - ')+(f&&f.name),e.d])});S.be.forEach(e=>{const b=bm(e.bid);if(e.k=='S'&&e.recv)o.push([e.date,'விற்பனை - '+(b&&b.name),e.recv]);if(e.k=='C')o.push([e.date,'வசூல் - '+(b&&b.name),-e.d])});S.hk.forEach(e=>e.recv&&o.push([e.date,'மட்டை - '+e.who,e.recv]));S.lb.forEach(e=>o.push([e.date,'கூலி - '+e.who,-e.amt]));S.ex.forEach(e=>o.push([e.date,e.type,-e.amt]));return o}
const fm=i=>S.f.find(x=>x.id==i),bm=i=>S.b.find(x=>x.id==i),opt=l=>l.map(x=>`<option value="${x.id}">${x.name}${x.v?' ('+x.v+')':''}</option>`).join('');
const F=(i,l,x='')=>`<label>${l}<input id="${i}" type="number" inputmode="decimal" step="any" ${x}></label>`;
const DF=(i,fn='')=>`<label>தேதி <b id="${i}f">${fd(td())}</b><input id="${i}" type="date" value="${td()}" oninput="$('${i}f').textContent=fd(this.value);${fn}"></label>`;
const TX=(i,l)=>`<label>${l}<input id="${i}"></label>`,MD=i=>`<label>Mode<select id="${i}"><option>Cash</option><option>Bank</option><option>UPI</option></select></label>`;
const wa=(ph,tx)=>window.open('https://wa.me/'+(ph||'').replace(/\D/g,'')+'?text='+encodeURIComponent(tx),'_blank');
function newParty(k){const name=prompt('பெயர்');if(!name)return;const v=prompt('ஊர்')||'',ph=prompt('தொலைபேசி')||'';S[k].push({id:uid(),name,v,ph,bal:0});save();render()}
function go(x,pre){ed=null;cur=x;render();if(pre&&$('pf0')){$('pf0').value=pre;calcP('f')}}
function subs(key,list){const c=sb[key]||list[0][0];return `<div class="sub">${list.map(([k,l])=>`<button class="${c==k?'on':''}" onclick="sb['${key}']='${k}';render()">${l}</button>`).join('')}</div>`}
function render(){$('nav').innerHTML=TABS.map(([k,a,b])=>`<button class="${cur==k?'on':''}" onclick="go('${k}')">${t(a,b)}</button>`).join('');$('m').innerHTML=(ed?'<div class="warn">✏️ திருத்தம் செய்யப்படுகிறது - சேமித்தால் பழைய பதிவு மாற்றப்படும் <button class="btn s x" onclick="ed=null;render()">ரத்து</button></div>':'')+V[cur]();const al=alerts();$('bell').textContent=al.h.length+al.o.length;if(cur=='p')calcP('f');if(cur=='s'&&$('rows')){if(!$('rows').children.length)addRow();calcS()}if(cur=='y'){yi();ci()}if(cur=='r'&&sb.r=='pl')0}
function alerts(){const h=S.f.filter(f=>f.last&&dd(td(),f.last)>=55);const o=S.b.filter(b=>b.bal>0&&b.ls&&dd(td(),b.ls)>=15);return{h,o}}
const V={};
V.d=()=>{const s=stk(),g=GR&&0,avg=.55,al=alerts(),cash=flows().reduce((a,x)=>a+x[2],0);
const pay=S.f.filter(f=>f.bal>0),adv=S.f.filter(f=>f.bal<0),rc=S.b.filter(b=>b.bal>0),sm=(l,k)=>l.reduce((a,x)=>a+Math.abs(x[k]),0);
const gm=Math.round(S.fe.length?(S.fe.filter(e=>e.k=='P').slice(-1)[0]||{gram:550}).gram:550);
return `<div class="g">${[['உரிக்காத காய் இருப்பு',s.u+' காய்கள்','தோராய எடை: '+Math.round(s.u*gm/1000)+' Kg'],['உரித்த காய் இருப்பு',s.h+' காய்கள்','தோராய எடை: '+Math.round(s.h*gm/1000)+' Kg'],['தேங்காய் மட்டை இருப்பு',s.k+' மட்டைகள்','']].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="k">${c[2]}</div></div>`).join('')}</div>
<div class="g"><div class="card" style="cursor:pointer" onclick="sb.r='db';go('r')"><div class="k">இன்றைய கல்லா இருப்பு</div><div class="v">${R(cash)}</div></div>
<div class="card"><div class="k">விவசாயிகளுக்குக் கொடுக்க வேண்டியது</div><div class="v">${R(pay.reduce((a,f)=>a+f.bal,0))}</div><div class="k">${pay.length} நபர்கள்</div></div>
<div class="card"><div class="k">விவசாயிகளிடம் முன்பணம்</div><div class="v">${R(-adv.reduce((a,f)=>a+f.bal,0))}</div><div class="k">${adv.length} நபர்கள்</div></div>
<div class="card"><div class="k">வியாபாரிகளிடம் வர வேண்டியது</div><div class="v">${R(rc.reduce((a,b)=>a+b.bal,0))}</div><div class="k">${rc.length} நபர்கள்</div></div></div>
<div class="card"><h3>வெட்டுக்குத் தயாரான விவசாயிகள் (55+ நாட்கள்)</h3><table>${al.h.map(f=>`<tr><td>${f.name}</td><td>${f.v}</td><td>${fd(f.last)}</td><td class="red">${dd(td(),f.last)} நாட்கள் ஆகிவிட்டது</td><td><a href="tel:${f.ph}"><button class="btn s">📞 Call</button></a><button class="btn s o" onclick="go('p','${f.id}')">+ காய் வெட்டுப் பதிவு</button></td></tr>`).join('')||'<tr><td>அறிவிப்பு இல்லை</td></tr>'}</table></div>
<div class="card"><h3>வியாபாரிகள் பாக்கி முதிர்வு (15+ நாட்கள்)</h3><table>${al.o.map(b=>{const d=dd(td(),b.ls);return `<tr><td>${b.name}</td><td>${R(b.bal)}</td><td class="${d>=30?'red':'amb'}">${d} நாட்கள்</td><td><button class="btn s" onclick="wa('${b.ph}','SKP COCO Traders\\nதேதி: ${fd(td())}\\nவியாபாரி: ${b.name}\\nபாக்கி: ${R(b.bal)}')">📲 WhatsApp நினைவூட்டல்</button><button class="btn s o" onclick="sb.y='c';go('y')">+ வசூல் பதிவு</button></td></tr>`}).join('')||'<tr><td>அறிவிப்பு இல்லை</td></tr>'}</table></div>`};
V.p=()=>`<div class="card"><h3>தேங்காய் கொள்முதல்</h3><div class="g">${DF('pdt',"calcP('dt')")}<label>விவசாயி<select id="pf0" onchange="fSel()">${opt(S.f)}</select></label><div><button class="btn s o" onclick="newParty('f')">+ புதிய விவசாயி</button></div></div><div id="pinfo" class="k"></div>
<div class="g">${F('pg','வெட்டிய மொத்த காய்கள்','oninput="calcP(\'g\')"')}${F('pp','இலாபக் காய் %','value=8 oninput="calcP(\'pp\')"')}${F('pd','இலாபக் காய் எண்ணிக்கை','oninput="this.dataset.m=1;calcP(\'pd\')"')}${F('pb','பில் நிகர காய்கள்','readonly')}${F('pr','1 காய் விலை ₹','value=12 oninput="calcP(\'pr\')"')}${F('pa','தேங்காய் மொத்தத் தொகை ₹','readonly')}${F('pcr','1 காய் வெட்டுக் கூலி ₹','value=1.25 oninput="calcP(\'pcr\')"')}${F('pc','மொத்த வெட்டுக் கூலி ₹','oninput="this.dataset.m=1;calcP(\'pc\')"')}${F('pgm','1 காயின் தோராய எடை (g)','value=550')}${F('pn','பில் நிகரத் தொகை ₹','readonly')}</div>
<div id="pint" style="display:none;border-top:1px dashed var(--ac);margin-top:10px;padding-top:8px"><b style="color:var(--ac)">முன்பணம் & வட்டி கழிப்பு</b><div id="ptxt" class="k"></div>
<label><input type="radio" name="im" value="m" checked onchange="calcP('i')"> முழு மாத வட்டி (Default)</label><label><input type="radio" name="im" value="d" onchange="calcP('i')"> நாள் கணக்கு வட்டி</label><label><input type="radio" name="im" value="n" onchange="calcP('i')"> வட்டி இல்லை</label>
<div class="g">${F('pi','இன்று கழிக்கும் வட்டி ₹','oninput="this.dataset.m=1;calcP(\'pi\')"')}${F('pq','இன்று கழிக்கும் அசல் ₹','oninput="this.dataset.m=1;calcP(\'pq\')"')}</div></div>
<div class="g">${F('pfin','இறுதி பட்டுவாடா ₹','readonly')}${F('pw','இப்போது கொடுக்கும் தொகை ₹','oninput="this.dataset.m=1;calcP(\'pw\')"')}${MD('pm')}${TX('pnote','Notes')}${F('pcl','புதிய கணக்கு இருப்பு','readonly')}</div>
<button class="btn" onclick="savP()">💾 கொள்முதல் சேமி</button><button class="btn o" onclick="savP(1)">📲 சேமித்து WhatsApp பில் அனுப்பு</button><button class="btn x" onclick="ed=null;render()">✕ ரத்து</button></div>`;
function fSel(){['pi','pq','pw'].forEach(i=>$(i).dataset.m='');calcP('f')}
function calcP(s){const g=n('pg');if(s=='g'||s=='pp')$('pd').dataset.m='';if(s=='g'||s=='pcr')$('pc').dataset.m='';
if(!$('pd').dataset.m)$('pd').value=Math.round(g*n('pp')/100);const bill=g-n('pd');$('pb').value=bill;const amt=bill*n('pr');$('pa').value=amt;
if(!$('pc').dataset.m)$('pc').value=+(g*n('pcr')).toFixed(2);const net=amt-n('pc');$('pn').value=net;
const f0=fm($('pf0').value);if(!f0){$('pinfo').textContent='';return}const f=Object.assign({},f0,{bal:f0.bal-(ed&&ed.k=='P'&&ed.old.fid==f0.id?ed.old.d:0)});
